services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:11
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      FORGEJO__server__ROOT_URL: ${F451_FORGEJO_ROOT_URL:-http://localhost:3300/}
      FORGEJO__server__HTTP_PORT: "3000"
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__database__DB_TYPE: sqlite3
    ports:
      - "${F451_FORGEJO_HTTP_PORT:-3300}:3000"
      - "${F451_FORGEJO_SSH_PORT:-2222}:22"
    volumes:
      - forgejo-data:/data

volumes:
  forgejo-data:
