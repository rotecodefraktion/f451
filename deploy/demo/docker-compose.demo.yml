# Public demo instance: overlay on deploy/git + deploy/wiki, run as ONE compose
# project so Caddy, the app and Forgejo share a network. See README.md.
#
#   docker compose -p f451demo --env-file <demo.env> \
#     -f deploy/git/docker-compose.yml -f deploy/wiki/docker-compose.yml \
#     -f deploy/demo/docker-compose.demo.yml up -d
#
# Only Caddy is reachable from outside (80/443). The app containers publish
# their ports on 127.0.0.1 only (F451_*_PORT in demo.env), for debugging.

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      F451_DEMO_HOST: ${F451_DEMO_HOST:?F451_DEMO_HOST missing}
      F451_DEMO_GIT_HOST: ${F451_DEMO_GIT_HOST:?F451_DEMO_GIT_HOST missing}
      F451_STATS_USER: ${F451_STATS_USER:?F451_STATS_USER missing}
      # Legal notice / privacy policy of the operator (demo.env); "/" if unset.
      F451_IMPRINT_URL: ${F451_IMPRINT_URL:-/}
      F451_PRIVACY_URL: ${F451_PRIVACY_URL:-/}
      F451_STATS_HASH: ${F451_STATS_HASH:?F451_STATS_HASH missing}
    volumes:
      # Relative paths resolve from deploy/git (the first compose file).
      # A directory, not the single file: git replaces files on update (new
      # inode), and a single-file bind mount would keep showing the old one.
      - ../demo/caddy:/etc/caddy:ro
      - ../demo/theme:/srv/theme:ro
      - ../demo/maintenance:/srv/maintenance:ro
      - ../demo/legal:/srv/legal:ro
      - maintenance-state:/srv/state
      - caddy-logs:/var/log/caddy
      - stats-report:/srv/stats:ro
      - caddy-data:/data
      - caddy-config:/config
    # No depends_on: the API discovers the OIDC issuer through Caddy
    # (https://<git host>), so Caddy must not wait for the app.

  forgejo:
    restart: unless-stopped
    volumes:
      # Look of the Git side (see forgejo/README.md); nested in the data volume.
      - ../demo/forgejo/public:/data/gitea/public:ro
      - ../demo/forgejo/templates:/data/gitea/templates:ro
    environment:
      FORGEJO__server__DOMAIN: ${F451_DEMO_GIT_HOST}
      FORGEJO__server__LANDING_PAGE: login
      # Top-level app.ini key: four underscores = no section.
      FORGEJO____APP_NAME: f451 Git
      FORGEJO__ui__THEMES: forgejo-auto,forgejo-light,forgejo-dark,f451
      FORGEJO__ui__DEFAULT_THEME: f451
      FORGEJO__server__DISABLE_SSH: "true"
      # Visitors get accounts from the operator, never by self-registration.
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__service__DEFAULT_ALLOW_CREATE_ORGANIZATION: "false"
      FORGEJO__repository__MAX_CREATION_LIMIT: "0"
      FORGEJO__admin__DISABLE_REGULAR_ORG_CREATION: "true"
      # Shared visitor accounts: no self-deletion, no keys. Password and 2FA
      # changes can't be forbidden here — demo.sh guard repairs those.
      FORGEJO__admin__USER_DISABLED_FEATURES: deletion,manage_ssh_keys,manage_gpg_keys

  # Visitor statistics from Caddy's access log (`demo.sh stats`, timer every
  # 10 min). --persist/--restore keep the counts in goaccess-db across runs,
  # log rotation and the nightly reset.
  goaccess:
    image: allinurl/goaccess:1.9.4
    profiles: [tools]
    volumes:
      - caddy-logs:/logs:ro
      - goaccess-db:/db
      - stats-report:/report
    command:
      - /logs/access.log
      - --log-format=CADDY
      - --persist
      - --restore
      - --db-path=/db
      - --ignore-crawlers
      - --html-report-title=f451 demo — visitors
      - -o
      - /report/index.html

volumes:
  maintenance-state:
  caddy-logs:
  goaccess-db:
  stats-report:
  caddy-data:
  caddy-config:
