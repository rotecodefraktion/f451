name: release

# On a version tag (v1.2.3): build the web, api and mcp images and publish
# them to the GitHub Container Registry as ghcr.io/rotecodefraktion/f451-*:
# <version>, <major>.<minor> and latest. Servers pull them with
# deploy/wiki/docker-compose.registry.yml (F451_REGISTRY=ghcr.io/rotecodefraktion).
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [web, api, mcp]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/f451-${{ matrix.app }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=f451-${{ matrix.app }}
            org.opencontainers.image.licenses=LicenseRef-f451-1.1
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Build-time rewrite targets of the web image, same as deploy/wiki/docker-compose.yml.
          build-args: |
            API_URL=http://api:3001
            DRAWIO_INTERNAL_URL=http://drawio:8080
            MCP_INTERNAL_URL=http://mcp:3002
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
